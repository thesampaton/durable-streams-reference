services:
  server:
    build: .
    environment:
      PORT: "4437"
      LONG_POLL_TIMEOUT_SECS: "30"
      SSE_RECONNECT_INTERVAL_SECS: "60"
      RUST_LOG: "info"
    ports:
      - "4437:4437"

  server-tls:
    build: .
    environment:
      PORT: "4438"
      LONG_POLL_TIMEOUT_SECS: "30"
      SSE_RECONNECT_INTERVAL_SECS: "60"
      RUST_LOG: "info"
      TLS_CERT_PATH: "/etc/ds/tls/server-cert.pem"
      TLS_KEY_PATH: "/etc/ds/tls/server-key.pem"
    volumes:
      - ./e2e/fixtures/ds-server-cert.pem:/etc/ds/tls/server-cert.pem:ro
      - ./e2e/fixtures/ds-server-key.pem:/etc/ds/tls/server-key.pem:ro
    networks:
      default:
        aliases:
          - server
    profiles: ["tls"]

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./e2e/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./e2e/fixtures/jwks.json:/etc/envoy/jwks.json:ro
    depends_on:
      - server

  envoy-tls:
    image: envoyproxy/envoy:v1.31-latest
    ports:
      - "8082:8080"
      - "9902:9901"
    volumes:
      - ./e2e/envoy-tls.yaml:/etc/envoy/envoy.yaml:ro
      - ./e2e/fixtures/jwks.json:/etc/envoy/jwks.json:ro
      - ./e2e/fixtures/ds-ca-cert.pem:/etc/envoy/upstream-ca.pem:ro
    depends_on:
      - server-tls
    profiles: ["tls"]

  postgres:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: durable_streams
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "54321:5432"
    volumes:
      - ./e2e/sync/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["sync", "tls"]

  electric:
    image: electricsql/electric:1.4.2
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/durable_streams?sslmode=disable
      ELECTRIC_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["sync", "tls"]

  sync-service:
    build: ./e2e/sync
    environment:
      ELECTRIC_URL: http://electric:3000
      DS_SERVER_URL: http://server:4437
      POSTGRES_URL: postgresql://postgres:password@postgres:5432/durable_streams
    depends_on:
      electric:
        condition: service_healthy
      server:
        condition: service_started
    profiles: ["sync"]

  sync-service-tls:
    build: ./e2e/sync
    environment:
      ELECTRIC_URL: http://electric:3000
      DS_SERVER_URL: https://server:4438
      POSTGRES_URL: postgresql://postgres:password@postgres:5432/durable_streams
      NODE_EXTRA_CA_CERTS: /etc/ssl/ds/ds-ca-cert.pem
    volumes:
      - ./e2e/fixtures/ds-ca-cert.pem:/etc/ssl/ds/ds-ca-cert.pem:ro
    depends_on:
      electric:
        condition: service_healthy
      server-tls:
        condition: service_started
    profiles: ["tls"]

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: durable_streams
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["dev"]

  producer:
    build: ./e2e/producer
    environment:
      DS_SERVER_URL: http://server:4437
      POSTGRES_URL: postgresql://postgres:password@postgres:5432/durable_streams
      PRODUCER_INTERVAL_MS: "5000"
    depends_on:
      sync-service:
        condition: service_started
      postgres:
        condition: service_healthy
    profiles: ["dev"]
