name: CI

permissions:
  contents: read

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-fmt:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib

      - name: Run integration tests
        run: cargo test --test '*'

  governance:
    name: Governance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required governance files exist
        run: |
          echo "Checking governance files..."
          test -f SPEC_VERSION.md || (echo "Missing SPEC_VERSION.md" && exit 1)
          test -f docs/protocol-governance.md || (echo "Missing docs/protocol-governance.md" && exit 1)
          test -f docs/blocker-policy.md || (echo "Missing docs/blocker-policy.md" && exit 1)
          test -f docs/compatibility.md || (echo "Missing docs/compatibility.md" && exit 1)
          test -f docs/decisions.md || (echo "Missing docs/decisions.md" && exit 1)
          test -f docs/gaps.md || (echo "Missing docs/gaps.md" && exit 1)
          echo "All governance files present"

      - name: Verify SPEC_VERSION.md has SHA
        run: |
          echo "Checking SPEC_VERSION.md contains spec SHA..."
          grep -q "Pinned Commit SHA:" SPEC_VERSION.md || (echo "SPEC_VERSION.md missing spec SHA" && exit 1)
          grep -q "Version:" SPEC_VERSION.md || (echo "SPEC_VERSION.md missing conformance version" && exit 1)
          echo "SPEC_VERSION.md valid"
